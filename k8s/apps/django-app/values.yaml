replicaCount: 2

awsRegion: "ap-south-1"

image:
  repository: "ghcr.io/h1zardian/devsecops-pipeline-project"
  pullPolicy: Always
  tag: "sha-fd11ee1"
  digest: "sha256:e9d9cdaf94f1f48403f2eb98c0018103899d9edfb7511e6affa87f7196cab291"

sqlHost: "devsecops-postgres-dev.cmksk3juhzgm.ap-south-1.rds.amazonaws.com"
allowedHosts: "*"

externalSecrets:
  enabled: true
  environment: "dev"
  secretKey: ""
  postgresPassword: ""

serviceAccount:
  create: true
  name: django-sa
  annotations: {}

# Default: an internet-facing AWS load balancer with an AWS-generated hostname.
# For a custom HTTPS domain, change this to ClusterIP and enable ingress below.
service:
  type: LoadBalancer
  annotations: {}

ingress:
  enabled: false
  className: traefik
  host: app.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
