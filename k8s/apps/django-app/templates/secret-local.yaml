{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: django-app-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: django-app
  {{- if .Values.gitOps.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  {{- end }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.externalSecrets.secretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.externalSecrets.postgresPassword | quote }}
{{- end }}
