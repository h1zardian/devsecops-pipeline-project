apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
  annotations:
    policies.kyverno.io/title: Require Cosign Image Signature
    policies.kyverno.io/category: Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  app.kubernetes.io/name: django-app
      verifyImages:
        - imageReferences:
            - "ghcr.io/*/*:*"
            - "ghcr.io/*/*@sha256:*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/h1zardian/devsecops-pipeline-project/.github/workflows/ci-app.yml@refs/heads/main"
                    rekor:
                      url: "https://rekor.sigstore.dev"
