apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/h1zardian/devsecops-pipeline-project.git
    targetRevision: main
    path: k8s/apps/monitoring-stack
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      name: grafana-admin-credentials
      namespace: monitoring
      jsonPointers:
        - /metadata/annotations/force-sync
      managedFieldsManagers:
        - external-secrets
        - kubectl-annotate
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
