version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    groups:
      terraform-dependencies:
        patterns:
          - "*"

  # Child modules declare registry modules of their own. Their lockfiles are
  # intentionally omitted; only the root module lockfile is used at runtime.
  - package-ecosystem: terraform
    directory: /infra/terraform/modules/eks
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/modules/vpc
    schedule:
      interval: weekly
