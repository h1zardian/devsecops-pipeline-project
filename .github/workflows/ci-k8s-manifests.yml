name: Kubernetes Manifests & Policy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - '.github/workflows/ci-k8s-manifests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'

jobs:
  validate-manifests:
    name: Helm Template, Kubeconform & Kyverno Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm & Kubeconform
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform

      - name: Render Helm Template & Kubeconform Schema Validation
        run: |
          helm template django-app k8s/apps/django-app | kubeconform -strict -ignore-missing-schemas -summary

      - name: Install Kyverno CLI
        run: |
          curl -sSfL https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz | tar -xz -C /usr/local/bin kyverno

      - name: Kyverno Policy Test & Apply Dry-Run
        run: |
          helm template django-app k8s/apps/django-app > rendered.yaml
          kyverno apply k8s/policies/require-non-root.yaml k8s/policies/require-resource-limits.yaml k8s/policies/disallow-latest-tag.yaml --resource rendered.yaml

      - name: Checkov Kubernetes Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
