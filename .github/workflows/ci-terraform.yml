name: Terraform Infrastructure CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-terraform.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/terraform/**'

permissions:
  contents: read

jobs:
  terraform-ci:
    name: Lint, Checkov & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run TFLint
        run: |
          cd infra/terraform
          tflint --init
          tflint

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

  terraform-apply:
    name: Terraform Apply (Production / Environment Approval)
    needs: terraform-ci
    # Infrastructure changes require an explicit manual dispatch. Pushes and
    # pull requests still run validation, but cannot mutate AWS automatically.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Terraform Plan & Apply
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          cd infra/terraform
          [ -f environments/dev.tfvars ] || cp environments/dev.tfvars.example environments/dev.tfvars
          terraform init
          terraform plan -var-file=environments/dev.tfvars -out=tfplan
          terraform apply tfplan
