name: App CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scans:
    name: Security Scans (Gitleaks + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bandit SAST Scan
        run: |
          pip install bandit
          bandit -r app/ -x app/console/settings.py

  build-scan-push:
    name: Build, Scan, Push & Sign Container
    needs: security-scans
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push-image.outputs.digest }}
      image-tag: ${{ steps.prep.outputs.tag }}
      base-image: ${{ steps.prep.outputs.base_image }}
      image-name: ${{ steps.prep.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Image Tag & Metadata
        id: prep
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          REPO_LOWER=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "base_image=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "full_image=${REPO_LOWER}:${TAG}" >> $GITHUB_OUTPUT

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Build Image via Buildah (Local)
        run: |
          buildah build -t ${{ steps.prep.outputs.full_image }} ./app
          buildah push ${{ steps.prep.outputs.full_image }} docker-archive:django-app.tar

      - name: Trivy Vulnerability Scan (Pre-Push Gate)
        uses: aquasecurity/trivy-action@master
        with:
          input: 'django-app.tar'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        id: push-image
        run: |
          buildah push --authfile ~/.docker/config.json ${{ steps.prep.outputs.full_image }}
          DIGEST=$(buildah inspect --format '{{.Digest}}' ${{ steps.prep.outputs.full_image }})
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Cosign & Syft
        uses: sigstore/cosign-installer@v3.8.0

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate & Attach SBOM (Syft CycloneDX)
        run: |
          syft docker-archive:django-app.tar -o cyclonedx-json=sbom.cyclonedx.json
          cosign attach sbom --sbom sbom.cyclonedx.json ${{ steps.prep.outputs.full_image }}

      - name: Cosign Keyless Image & SBOM Signing
        run: |
          cosign sign --yes ${{ steps.prep.outputs.full_image }}

  provenance:
    name: SLSA Level 3 Provenance Attestation
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      id-token: write
      packages: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build-scan-push.outputs.base-image }}
      digest: ${{ needs.build-scan-push.outputs.image-digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  update-gitops:
    name: Update GitOps Repository
    needs: [build-scan-push, provenance]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Image Repository & Tag
        run: |
          sed -i 's|repository: .*|repository: "${{ needs.build-scan-push.outputs.base-image }}"|' k8s/apps/django-app/values.yaml
          sed -i 's|tag: .*|tag: "${{ needs.build-scan-push.outputs.image-tag }}"|' k8s/apps/django-app/values.yaml

      - name: Commit & Push New Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/django-app/values.yaml
          git commit -m "chore(gitops): update django-app image tag to ${{ needs.build-scan-push.outputs.image-tag }}" || exit 0
          git push
