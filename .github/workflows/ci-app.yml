name: App CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scans:
    name: Security Scans (Gitleaks + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Bandit SAST Scan
        run: |
          python -m pip install --disable-pip-version-check bandit==1.9.4 pip-audit==2.10.1
          bandit -r app/ -x app/console/settings.py

      - name: Python Dependency Vulnerability Gate
        run: pip-audit --requirement app/requirements.txt --strict

  build-scan-push:
    name: Build, Scan, Push & Sign Container
    needs: security-scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-digest: ${{ steps.push-image.outputs.digest }}
      image-tag: ${{ steps.prep.outputs.tag }}
      base-image: ${{ steps.prep.outputs.base_image }}
      image-name: ${{ steps.prep.outputs.full_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare Image Tag & Metadata
        id: prep
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          REPO_LOWER=$(printf '%s' "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=${TAG}"
            echo "base_image=${REPO_LOWER}"
            echo "full_image=${REPO_LOWER}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Build Image via Buildah (Local)
        run: |
          buildah build -t "${{ steps.prep.outputs.full_image }}" ./app
          buildah push "${{ steps.prep.outputs.full_image }}" docker-archive:django-app.tar

      - name: Trivy Vulnerability Scan (Pre-Push Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: 'django-app.tar'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        id: push-image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          buildah push --digestfile /tmp/digest.txt --authfile ~/.docker/config.json "${{ steps.prep.outputs.full_image }}"
          DIGEST=$(cat /tmp/digest.txt)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Install Syft
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      - name: Generate & Attest SBOM (Syft CycloneDX)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          syft docker-archive:django-app.tar -o cyclonedx-json=sbom.cyclonedx.json
          IMAGE_REF="${{ steps.prep.outputs.base_image }}@${{ steps.push-image.outputs.digest }}"
          cosign attest --yes --predicate sbom.cyclonedx.json --type cyclonedx "$IMAGE_REF"

      - name: Cosign Keyless Image Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_REF="${{ steps.prep.outputs.base_image }}@${{ steps.push-image.outputs.digest }}"
          cosign sign --yes "$IMAGE_REF"

  provenance:
    name: SLSA Level 3 Provenance Attestation
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      id-token: write
      packages: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@5a775b367a56d5bd118a224a811bba288150a563 # v2.0.0
    with:
      image: ${{ needs.build-scan-push.outputs.base-image }}
      digest: ${{ needs.build-scan-push.outputs.image-digest }}
      # SHA-pinned generator refs have no refs/tags/vX.Y.Z value for the
      # prebuilt-binary lookup, so compile the trusted pinned source instead.
      compile-generator: true
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  update-gitops:
    name: Update GitOps Repository
    needs: [build-scan-push, provenance]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Image Repository & Tag
        run: |
          sed -i 's|repository: .*|repository: "${{ needs.build-scan-push.outputs.base-image }}"|' k8s/apps/django-app/values.yaml
          sed -i 's|tag: .*|tag: "${{ needs.build-scan-push.outputs.image-tag }}"|' k8s/apps/django-app/values.yaml
          sed -i 's|digest: .*|digest: "${{ needs.build-scan-push.outputs.image-digest }}"|' k8s/apps/django-app/values.yaml

      - name: Commit & Push New Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/django-app/values.yaml
          git commit -m "chore(gitops): update django-app image tag to ${{ needs.build-scan-push.outputs.image-tag }}" || exit 0
          git push
