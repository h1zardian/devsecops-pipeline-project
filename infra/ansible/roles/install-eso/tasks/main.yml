---
- name: Configure External Secrets Helm repository
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
    force_update: true

- name: Create external-secrets namespace
  kubernetes.core.k8s:
    name: "{{ eso_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy External Secrets Operator via Helm
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "{{ eso_chart_version }}"
    release_namespace: "{{ eso_namespace }}"
    state: present
    wait: true
    wait_timeout: "5m0s"
    values:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: "{{ eso_irsa_role_arn }}"
