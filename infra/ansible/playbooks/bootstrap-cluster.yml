---
- name: Day 0 EKS Platform Bootstrap Playbook
  hosts: localhost
  gather_facts: false
  vars:
    git_repo_url: "{{ lookup('env', 'GIT_REPO_URL') | default('https://github.com/h1zardian/devsecops-platform-provisioning-pipeline.git', true) }}"
    argocd_chart_version: "5.52.0"
    kyverno_chart_version: "3.1.4"
    eso_chart_version: "0.9.11"
    monitoring_chart_version: "55.4.0"
    ingress_chart_version: "4.9.0"
    cert_manager_chart_version: "v1.13.3"

  roles:
    - install-argocd
    - install-kyverno
    - install-eso
    - install-monitoring
    - install-ingress
    - install-cert-manager
    - configure-argocd-apps
