---
- name: Day 0 EKS Platform Bootstrap Playbook
  hosts: localhost
  gather_facts: false
  vars:
    git_repo_url: "{{ lookup('env', 'GIT_REPO_URL') | default('https://github.com/h1zardian/devsecops-pipeline-project.git', true) }}"
    argocd_chart_version: "10.2.2"
    kyverno_chart_version: "3.8.2"
    eso_chart_version: "2.8.0"
    ingress_chart_version: "41.1.0"
    cert_manager_chart_version: "v1.21.1"
    # Set true (for example with --extra-vars) only after configuring the
    # custom domain values documented in the repository README.
    custom_domain_enabled: false

  roles:
    - install-argocd
    - install-kyverno
    - install-eso
    - role: install-ingress
      when: custom_domain_enabled | bool
    - role: install-cert-manager
      when: custom_domain_enabled | bool
    - configure-argocd-apps
