# .pre-commit-config.yaml
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # The root module loads and validates every child with the canonical
        # root lock file; isolated child init creates divergent provider locks.
        exclude: ^infra/terraform/modules/
      - id: terraform_tflint

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - '-c'
          - pyproject.toml
